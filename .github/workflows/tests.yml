name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Valores falsos de relleno: los tests simulan las dependencias, pero
      # Settings exige que las variables existan.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://:test@localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Informativo hasta actualizar FastAPI/pytest: hoy hay avisos conocidos
      # en starlette (transitiva) y pytest. No queremos dejar el CI rojo.
      - name: Auditoría de dependencias (informativa)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Correr los tests
        run: python -m pytest -q

  docker:
    name: imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t sentinel-api-backend:ci ./api

      - name: Correr los tests dentro de la imagen
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/test \
            -e REDIS_URL=redis://:test@localhost:6379/0 \
            sentinel-api-backend:ci python -m pytest -q

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose --profile tools config -q

  integration:
    name: integración (Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-solo-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel_app:ci-app-solo-test@localhost:5432/sentinel
      MIGRATION_DATABASE_URL: postgresql://sentinel_migrator:ci-migrator-solo-test@localhost:5432/sentinel
      TEST_MIGRATION_DATABASE_URL: postgresql://sentinel_migrator:ci-migrator-solo-test@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Crear roles y base de tests
        run: |
          PGPASSWORD=ci-solo-test psql -h localhost -U sentinel -d sentinel \
            -v app_password="ci-app-solo-test" \
            -v migrator_password="ci-migrator-solo-test" <<'SQL'
          CREATE ROLE sentinel_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'app_password';
          CREATE ROLE sentinel_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'migrator_password';
          GRANT CONNECT ON DATABASE sentinel TO sentinel_app;
          GRANT CONNECT ON DATABASE sentinel TO sentinel_migrator;
          GRANT USAGE ON SCHEMA public TO sentinel_app;
          GRANT USAGE, CREATE ON SCHEMA public TO sentinel_migrator;
          SQL
          PGPASSWORD=ci-solo-test psql -h localhost -U sentinel -d sentinel \
            -c "CREATE DATABASE sentinel_test OWNER sentinel_migrator"
          PGPASSWORD=ci-solo-test psql -h localhost -U sentinel -d sentinel_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis"
          PGPASSWORD=ci-solo-test psql -h localhost -U sentinel -d sentinel_test \
            -c "GRANT CONNECT ON DATABASE sentinel_test TO sentinel_app"
          PGPASSWORD=ci-solo-test psql -h localhost -U sentinel -d sentinel_test \
            -c "GRANT USAGE ON SCHEMA public TO sentinel_app"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Aplicar migraciones
        run: python -m alembic upgrade head

      - name: Tests de integración
        run: python -m pytest -q -m integration
