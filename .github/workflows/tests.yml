name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Valores falsos de relleno: los tests simulan las dependencias, pero
      # Settings exige que las variables existan.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://:test@localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr los tests
        run: python -m pytest -q

  docker:
    name: imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t sentinel-api-backend:ci ./api

      - name: Correr los tests dentro de la imagen
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/test \
            -e REDIS_URL=redis://:test@localhost:6379/0 \
            sentinel-api-backend:ci python -m pytest -q

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose --profile tools config -q

  integration:
    name: integración (Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-solo-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:ci-solo-test@localhost:5432/sentinel
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests de integración
        run: python -m pytest -q -m integration
